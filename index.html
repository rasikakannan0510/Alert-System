<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Alert</title>

<style>
body{
font-family: Arial, sans-serif;
text-align:center;
margin-top:100px;
background-color:#f2f2f2;
}

h1{
color:#333;
}

button{
padding:15px 25px;
font-size:18px;
background-color:rgb(166,180,226);
color:white;
border:none;
border-radius:5px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background-color:rgb(120,140,210);
}

#alertBox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:red;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:30px;
z-index:999;
}

.hidden{
display:none !important;
}
</style>
</head>

<body>

<h1>Emergency Alert System</h1>

<button id="trigger">Send Emergency Alert</button>

<div id="alertBox" class="hidden">
<h2>🚨 EMERGENCY ALERT 🚨</h2>
<p>Someone needs your attention immediately!</p>
<button onclick="stopAlert()">Stop Alert</button>
</div>

<audio id="alarm">
<source src="beep.mp3" type="audio/mpeg">
</audio>

<script>
const triggerBtn = document.getElementById("trigger");
const alertBox = document.getElementById("alertBox");
const alarm = document.getElementById("alarm");

triggerBtn.addEventListener("click", function(){

alertBox.classList.remove("hidden");

alarm.loop = true;
alarm.play().catch(error => console.log(error));

if(navigator.vibrate){
navigator.vibrate([500,200,500,200,500]);
}

});

function stopAlert(){

alertBox.classList.add("hidden");

alarm.pause();
alarm.currentTime = 0;

if(navigator.vibrate){
navigator.vibrate(0);
}

}
</script>

</body>
</html>
